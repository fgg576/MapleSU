name: Build Manager
on: workflow_dispatch

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  MAPLESU_PROVIDER_NDK: /usr/local/lib/android/sdk/ndk/28.2.13676358

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # 这里补上了 28 版本的 NDK
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "ndk;28.2.13676358" "cmake;3.22.1"
          
      - name: Set up Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.99.1
          source "$HOME/.cargo/env"
          rustup target add --toolchain 1.99.1 aarch64-linux-android
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r requirements-native.txt

      - name: Hack the first verification script
        run: |
          echo "import sys" > scripts/sync-ultra-sdk-identity.py
          echo "sys.exit(0)" >> scripts/sync-ultra-sdk-identity.py
          
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :manager:assembleDebug --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maple-manager-apk
          path: manager/build/outputs/apk/debug/*.apk
