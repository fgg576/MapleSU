name: Build MapleSU Manager
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          
      - uses: android-actions/setup-android@v3
      
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          
      - name: Set up Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.99.1
          rustup target add --toolchain 1.99.1 aarch64-linux-android
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Python deps
        run: pip install -r requirements-native.txt
        
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :manager:assembleDebug --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maple-manager-apk
          path: manager/build/outputs/apk/debug/*.apk
